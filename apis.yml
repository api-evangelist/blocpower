name: BlocPower
description: >-
  BlocPower is a Brooklyn-based climate technology and building decarbonization
  company, founded in 2014 as a Public Benefit Corporation, that makes urban
  buildings smarter, greener, and healthier with a focus on historically
  underserved communities. It combines deep building-science expertise with
  accessible financing to deliver energy-efficiency retrofits and electrification
  measures such as heat pumps, pairing construction management with clean-energy
  upgrades. As of late 2023 BlocPower reported more than 1,200 completed measures
  across 1,100+ buildings nationwide, thousands of metric tons of CO2e reduced,
  and hundreds of local job placements, earning recognition from the White House,
  EPA, and TIME. BlocPower is a portfolio company of a16z and is tracked in the
  API Evangelist network; it publishes no public developer API, developer portal,
  SDKs, or GitHub organization at this time.
